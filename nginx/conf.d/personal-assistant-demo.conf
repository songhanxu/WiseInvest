# Independent static demo for the personal domain. No WiseInvest API routes.
server {
    listen 80;
    server_name hanxusong.asia www.hanxusong.asia;

    root /srv/personal-assistant-demo;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
